<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emarie R. De La Nuez</title>
<meta name="description" content="Emarie R. De La Nuez: applied mathematics, sequential decision-making under uncertainty, stochastic control. Research, art, and photographs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23163d82'/%3E%3Ctext x='16' y='23' font-size='21' text-anchor='middle' fill='%23f2ede1' font-family='Georgia,serif' font-style='italic'%3Ee%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-stage="coat">

<!-- SVG filters: brushed coating edge + cyanotype duotone for photos -->
<svg class="defs" aria-hidden="true" width="0" height="0">
  <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022 0.06" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="cyan" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.06 0.92"/>
      <feFuncG type="table" tableValues="0.12 0.95"/>
      <feFuncB type="table" tableValues="0.58 1"/>
    </feComponentTransfer>
  </filter>
</svg>

<a class="skip-link" href="#research">Skip to research</a>

<header class="top">
  <a class="mark" href="#top">emarie</a>
  <nav aria-label="Sections">
    <a href="#research">research</a>
    <a href="#art">art</a>
    <a href="#photos">photos</a>
    <a href="#misc">misc</a>
    <a class="cv" data-cv href="#" target="_blank" rel="noopener">cv ↗</a>
  </nav>
</header>

<main id="top">
  <!-- ===== the print ===== -->
  <section class="hero" aria-label="Emarie R. De La Nuez">
    <div class="sheet" id="sheet" role="img" aria-label="A cyanotype print of parachutes drifting across a blue sky, with the name Emarie">
      <!-- 1. sensitized paper, darkens under the sun -->
      <div class="layer coat"><div class="bg"></div><div class="photo latent" aria-hidden="true"></div><div class="nm latent" aria-hidden="true"></div></div>
      <!-- 2. the negative laid on top -->
      <div class="layer negative"><div class="photo" aria-hidden="true"></div><div class="nm" aria-hidden="true"></div></div>
      <!-- 3. rinse: the blue comes up, name goes white -->
      <div class="layer rinse"><div class="bg"></div><div class="photo" aria-hidden="true"></div><div class="speck" aria-hidden="true"></div><div class="nm" aria-hidden="true"></div></div>
      <div class="water" aria-hidden="true"></div>
      <div class="sun" aria-hidden="true"></div>
    </div>
    <button id="skip" type="button" aria-label="Skip the animation"></button>
  </section>

  <div class="after">
    <section class="intro wrap">
      <img class="portrait" src="img/emarie.jpg" alt="Emarie De La Nuez">
      <div>
        <p class="lede" data-about></p>
        <p class="links" data-contact></p>
      </div>
    </section>

    <section id="research" class="wrap">
      <h2><span class="no">no. 01</span> research</h2>
      <div class="prints" data-research></div>
    </section>

    <section id="art" class="wrap">
      <h2><span class="no">no. 02</span> art</h2>
      <div class="prints art-plates" data-art></div>
    </section>

    <section id="photos" class="wrap">
      <h2><span class="no">no. 03</span> photos
        <button class="tone" id="tone" type="button" aria-pressed="false">cyanotype / color</button>
      </h2>
      <div class="photo-groups" data-photos></div>
    </section>

    <section id="misc" class="wrap">
      <h2><span class="no">no. 04</span> misc</h2>
      <div class="misc" data-misc></div>
    </section>

    <footer class="wrap foot">
      <p>printed in prussian blue · <span data-year></span></p>
      <button id="replay" type="button">↺ make the print again</button>
    </footer>
  </div>
</main>

<dialog id="lightbox"><img alt=""><p></p><button type="button" aria-label="Close">×</button></dialog>

<script src="content.js"></script>
<script src="site.js"></script>
<script src="main.js"></script>
</body>
</html>
